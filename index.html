    <script>
      // Runs before first paint to avoid a theme flash. Default: day mode + NYC Subway.
      var html = document.documentElement;
      try {
        if (localStorage.getItem('theme') === 'dark') html.classList.add('dark');
        var palette = localStorage.getItem('palette') || 'nyc';
        if (palette !== 'poster') html.dataset.theme = palette;
      } catch (e) {
        html.dataset.theme = 'nyc';
      }
